appId: ${APP_ID}
---

- assertVisible: "Continuar como aventureiro"
- tapOn: "Continuar como comerciante"

- assertVisible: "Criar uma conta"

- tapOn: "Adicionar foto do estabelecimento"

- runFlow:
    when:
      visible: "Permitir|Allow|While using the app"
    commands:
      - tapOn:
          text: "Permitir|Allow|While using the app"

- extendedWaitUntil:
    visible: "Pesquise|Search|Photos|Fotos"
    timeout: 10000

- tapOn:
    point: "50%, 30%"

- tapOn:
    point: "50%, 92%"

- extendedWaitUntil:
    visible: "Digite o nome do estabelecimento"
    timeout: 10000

- scrollUntilVisible:
    element:
      text: "Digite o nome do estabelecimento"
    direction: DOWN
    timeout: 20000

- tapOn: "Digite o nome do estabelecimento"
- inputText: "Loja E2E"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Digite o nome do proprietário"
    direction: DOWN
    timeout: 20000

- tapOn: "Digite o nome do proprietário"
- inputText: "Lojista E2E"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Digite o email do estabelecimento"
    direction: DOWN
    timeout: 20000

- tapOn: "Digite o email do estabelecimento"
- inputText: "lojae2e@email.com"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "__.___.___/____-__ ou ___.___.___-__"
    direction: DOWN
    timeout: 20000

- tapOn: "__.___.___/____-__ ou ___.___.___-__"
- inputText: "12345678000190"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Selecione a categoria da loja"
    direction: DOWN
    timeout: 20000

- tapOn: "Selecione a categoria da loja"
- extendedWaitUntil:
    visible: "Selecione a categoria"
    timeout: 10000
- tapOn: "Café"
- assertNotVisible: "Selecione a categoria"

- scrollUntilVisible:
    element:
      text: "Fale um pouco sobre a sua loja"
    direction: DOWN
    timeout: 20000

- tapOn: "Fale um pouco sobre a sua loja"
- inputText: "Loja E2E de testes do app PassaAqui"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Digite o bairro"
    direction: DOWN
    timeout: 20000

- tapOn: "Digite o bairro"
- inputText: "Recife Antigo"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Digite a rua"
    direction: DOWN
    timeout: 20000

- tapOn: "Digite a rua"
- inputText: "Rua do Bom Jesus"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Marcar localização da loja no mapa"
    direction: DOWN
    timeout: 20000

- tapOn: "Marcar localização da loja no mapa"
- extendedWaitUntil:
    visible: "Marque a localização da sua loja"
    timeout: 10000

- tapOn:
    point: "50%, 40%"
- tapOn: "Confirmar localização"
- assertVisible: "Localização marcada — toque para ajustar"

- scrollUntilVisible:
    element:
      text: "Digite sua senha"
    direction: DOWN
    timeout: 20000

- tapOn: "Digite sua senha"
- inputText: "Senha@123"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "Confirme sua senha"
    direction: DOWN
    timeout: 20000

- tapOn: "Confirme sua senha"
- inputText: "Senha@123"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "terms-checkbox"
    direction: DOWN
    timeout: 20000

- tapOn:
    id: "terms-checkbox"

- scrollUntilVisible:
    element:
      text: "Cadastrar"
    direction: DOWN
    timeout: 20000

- tapOn: "Cadastrar"

- extendedWaitUntil:
    visible: "Pedidos recentes"
    timeout: 30000
